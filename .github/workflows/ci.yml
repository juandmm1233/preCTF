name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "sqlite:///:memory:"
      JWT_SECRET: "ci-test-jwt-secret"
      TOKEN_SECRET: "ci-test-token-secret"
      INSTRUCTOR_KEY: "ci-test-instructor-key"
      ADMIN_EMAIL: "instructor@ucc.local"
      ADMIN_PASSWORD: "CambiaEstaClave!"
      ADMIN_CODE: "DOCENTE"
      ADMIN_NAME: "Instructor preCTF"
      PRECTF_FLAG_N1: "FLAG{PRECTF_N1_SQLI}"
      PRECTF_FLAG_N2: "FLAG{PRECTF_N2_COOKIE}"
      PRECTF_FLAG_N3: "FLAG{PRECTF_N3_LFI}"
      PRECTF_FLAG_N4: "FLAG{PRECTF_N4_CONFIG}"
      PRECTF_FLAG_N5: "FLAG{PRECTF_N5_CMDI}"
      PRECTF_FLAG_N6: "FLAG{PRECTF_N6_HASH}"
      PRECTF_FLAG_N7: "FLAG{PRECTF_N7_UPLOAD}"
      PRECTF_FLAG_N8: "FLAG{PRECTF_N8_SSH}"
      CHALLENGE_N1_IMAGE: "prectf-challenge-n1:local"
      DOCKER_HOST: "tcp://localhost:2375"
      TRAEFIK_DYNAMIC_DIR: "/tmp/traefik-test"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run pytest
        working-directory: backend
        run: |
          python -m pytest --tb=short -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
