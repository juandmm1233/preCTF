services:
  db:
    image: postgres:16-alpine
    container_name: prectf_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prectf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prectf}
      POSTGRES_DB: ${POSTGRES_DB:-prectf}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prectf} -d ${POSTGRES_DB:-prectf}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - app

  dockerproxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    container_name: prectf_dockerproxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      NETWORKS: 1
      IMAGES: 1
      INFO: 1
      VERSION: 1
      EVENTS: 1
      BUILD: 0
      EXEC: 0
      VOLUMES: 0
      AUTH: 0
      SECRETS: 0
      SWARM: 0
      SERVICES: 0
      TASKS: 0
      NODES: 0
      PLUGINS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - socket

  lab-proxy:
    image: traefik:v3.3
    container_name: prectf_lab_proxy
    restart: unless-stopped
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --log.level=INFO
      - --accesslog=false
    ports:
      - "${LAB_PUBLIC_PORT:-8088}:80"
    volumes:
      - traefik_dynamic:/etc/traefik/dynamic
    networks:
      - challenges

  challenge-n1:
    image: ${CHALLENGE_N1_IMAGE:-prectf-challenge-n1:local}
    build:
      context: .
      dockerfile: challenges/n1/Dockerfile
      additional_contexts:
        lab: ${CTF_LAB_N1_CONTEXT:-../CTF ucc/ctf1}
    profiles:
      - build-labs
    networks:
      - challenges

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prectf_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prectf}:${POSTGRES_PASSWORD:-prectf}@db:5432/${POSTGRES_DB:-prectf}
      DOCKER_HOST: tcp://dockerproxy:2375
      CHALLENGE_NETWORK: prectf_challenges
      TRAEFIK_DYNAMIC_DIR: /traefik/dynamic
    volumes:
      - traefik_dynamic:/traefik/dynamic
    depends_on:
      db:
        condition: service_healthy
      dockerproxy:
        condition: service_started
    ports:
      - "8001:8000"
    networks:
      - app
      - socket

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prectf_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - app

volumes:
  pgdata:
  traefik_dynamic:

networks:
  app:
    name: prectf_app
  socket:
    name: prectf_socket
  challenges:
    name: prectf_challenges
